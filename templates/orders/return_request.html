{% extends 'base.html' %}
{% block title %}Return Request - ShopNexus{% endblock %}
{% block content %}
<div class="page-header"><div class="container"><h1><i class="bi bi-arrow-return-left me-2"></i>Return Request</h1></div></div>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card-custom p-5">
        <div class="mb-4 p-3 rounded-3" style="background:#f8fafc">
          <div class="text-muted small">Order Number</div>
          <div class="fw-bold">#{{ order.order_number }}</div>
          <div class="text-muted small mt-1">Placed on {{ order.created_at|date:"M d, Y" }}</div>
        </div>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-bold">Return Reason *</label>
            <select name="reason" class="form-select" required>
              <option value="">Select reason...</option>
              <option value="defective">Defective / Damaged</option>
              <option value="wrong_item">Wrong Item Received</option>
              <option value="not_as_described">Not as Described</option>
              <option value="changed_mind">Changed Mind</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold">Description *</label>
            <textarea name="description" class="form-control" rows="4" placeholder="Please describe the issue in detail..." required></textarea>
          </div>
          <div class="d-flex gap-3">
            <button type="submit" class="btn btn-danger px-5 rounded-pill fw-bold" style="background:#FF6B35;border:none">Submit Request</button>
            <a href="{% url 'order_detail' order.pk %}" class="btn btn-outline-secondary px-5 rounded-pill">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
